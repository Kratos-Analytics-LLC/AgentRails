[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrails"
version = "0.1.0"
description = "A domain-agnostic safety layer for AI agents: declarative policy, dry-run, audit ledger and circuit breaker between an agent's proposed actions and their execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kratos Analytics LLC" }]
keywords = ["mcp", "agents", "guardrails", "claude", "ai-safety", "governance", "risk-management", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.0.0"]
yaml = ["pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentrails"]
