[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrails"
version = "0.1.0"
description = "Guardrails, dry-run harness and audit ledger for AI agents that place real broker orders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kratos Analytics LLC" }]
keywords = ["mcp", "agents", "trading", "guardrails", "claude", "brokerage", "risk-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentrails"]
