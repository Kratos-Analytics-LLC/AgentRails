name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # dev = pytest, yaml = exercise the optional YAML policy loader.
          # The MCP gateway is tested via its FastMCP shim, so `mcp` isn't needed.
          pip install -e ".[dev,yaml]"
      - name: Run tests
        run: pytest -q
